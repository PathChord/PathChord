# Add to the transparent.conf drop-in only for a configured eBPF listener.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON
ProtectSystem=full
ReadWritePaths=/sys/fs/bpf
ExecStartPre=+/usr/bin/install -d -o pathchord -g pathchord -m 0700 /sys/fs/bpf/pathchord
