---
name: Release packages

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || 'nightly' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            builder: cross
          - target: x86_64-unknown-freebsd
            runner: ubuntu-24.04
            builder: cross
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            builder: cargo
            msvc-arch: amd64
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
            builder: cargo
            msvc-arch: amd64_arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            builder: cargo
          - target: aarch64-apple-darwin
            runner: macos-15
            builder: cargo

    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Include Clang for the Linux eBPF build
        if: endsWith(matrix.target, '-linux-musl') || endsWith(matrix.target, '-linux-musleabihf')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cat > Cross.toml <<EOF
          [target.$TARGET]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends clang"]
          EOF

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
        run: |
          "$BUILDER" build --locked --release --target "$TARGET" \
            --bin pathchord-ingressd --bin pathchord-egressd --bin pathchordctl

      - name: Assemble role packages
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binaries="$PWD/target/$TARGET/release"
          mkdir -p dist
          cd dist
          for role in ingress egress; do
            package="pathchord-$role-$TARGET"
            mkdir "$package"
            cp ../LICENSE "$package/"
            if [[ "$RUNNER_OS" == Windows ]]; then
              cp "$binaries/pathchord-${role}d.exe" "$binaries/pathchordctl.exe" "$package/"
              python -m zipfile -c "$package.zip" "$package"
            else
              cp "$binaries/pathchord-${role}d" "$binaries/pathchordctl" "$package/"
              tar -czf "$package.tar.gz" "$package"
            fi
          done

      - name: Upload role packages
        uses: actions/upload-artifact@v4
        with:
          name: pathchord-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download role packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pathchord-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum pathchord-* > SHA256SUMS

      - name: Attach packages to published release
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber -- "$RELEASE_TAG" dist/*

      - name: Publish Nightly prerelease
        if: github.event_name == 'workflow_dispatch'
        run: |
          notes="Built from \`$GITHUB_SHA\` ([workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID))."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly --prerelease --latest=false --notes "$notes"
          else
            gh release create nightly dist/* --target "$GITHUB_SHA" \
              --title "PathChord Nightly" --prerelease --latest=false --notes "$notes"
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
            -f "sha=$GITHUB_SHA" -F force=true >/dev/null
