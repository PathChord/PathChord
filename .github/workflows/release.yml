---
name: Release packages

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the built assets
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.release_tag || 'nightly' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            builder: cross
          - target: x86_64-unknown-freebsd
            runner: ubuntu-24.04
            builder: cross
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            builder: cargo
            msvc-arch: amd64
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
            builder: cargo
            msvc-arch: amd64_arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            builder: cargo
          - target: aarch64-apple-darwin
            runner: macos-15
            builder: cargo

    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Include Clang for the Linux eBPF build
        if: endsWith(matrix.target, '-linux-musl') || endsWith(matrix.target, '-linux-musleabihf')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cat > Cross.toml <<EOF
          [target.$TARGET]
          pre-build = ["apt-get update && apt-get install -y --no-install-recommends clang"]
          EOF

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Build release binaries on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
        run: |
          "$BUILDER" build --locked --release --target "$TARGET" \
            --bin pathchord-ingressd --bin pathchord-egressd --bin pathchordctl

      - name: Build release binaries on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --target "$env:TARGET" `
            --bin pathchord-ingressd --bin pathchord-egressd --bin pathchordctl

      - name: Assemble role packages
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binaries="$PWD/target/$TARGET/release"
          mkdir -p dist
          cd dist
          for role in ingress egress; do
            package="pathchord-$role-$TARGET"
            mkdir "$package"
            cp ../LICENSE "$package/"
            if [[ "$RUNNER_OS" == Windows ]]; then
              cp "$binaries/pathchord-${role}d.exe" "$binaries/pathchordctl.exe" "$package/"
              python -m zipfile -c "$package.zip" "$package"
            else
              cp "$binaries/pathchord-${role}d" "$binaries/pathchordctl" "$package/"
              tar -czf "$package.tar.gz" "$package"
            fi
          done

      - name: Upload role packages
        uses: actions/upload-artifact@v7
        with:
          name: pathchord-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  package-debian:
    name: Debian packages
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [ingress, egress]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          name: pathchord-x86_64-unknown-linux-musl
          path: dist-input
      - name: Extract selected binaries
        env:
          ROLE: ${{ matrix.role }}
        run: |
          archive="dist-input/pathchord-$ROLE-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p package-input
          tar -xzf "$archive" -C package-input --strip-components=1
      - name: Build Debian package
        env:
          ROLE: ${{ matrix.role }}
        run: |
          PATHCHORD_ROLE="$ROLE" \
            PATHCHORD_DAEMON_BINARY="$PWD/package-input/pathchord-${ROLE}d" \
            PATHCHORDCTL_BINARY="$PWD/package-input/pathchordctl" \
            sh packaging/debian/build.sh dist
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: pathchord-native-debian-${{ matrix.role }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  package-alpine:
    name: Alpine packages
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [ingress, egress]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          name: pathchord-x86_64-unknown-linux-musl
          path: dist-input
      - name: Extract selected binaries
        env:
          ROLE: ${{ matrix.role }}
        run: |
          archive="dist-input/pathchord-$ROLE-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p package-input
          tar -xzf "$archive" -C package-input --strip-components=1
      - name: Build Alpine package in a native container
        env:
          ROLE: ${{ matrix.role }}
        run: |
          version="$(./packaging/version.sh)"
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            -e ROLE="$ROLE" -e VERSION="$version" \
            alpine:3.24 sh -ec '
              apk add --no-cache alpine-sdk
              adduser -D builder
              addgroup builder abuild
              chmod 777 /out
              cp -a /src /work
              chown -R builder:builder /work
              key="/home/builder/pathchord-alpine-$ROLE.rsa"
              su builder -s /bin/sh -c "umask 077 && openssl genrsa -out $key 2048"
              openssl rsa -in "$key" -pubout -out "$key.pub"
              install -m 0644 "$key.pub" /etc/apk/keys/
              install -m 0644 "$key.pub" /out/
              su builder -s /bin/sh -c "PACKAGER_PRIVKEY=$key PATHCHORD_ROLE=$ROLE PATHCHORD_VERSION=$VERSION \
                PATHCHORD_DAEMON_BINARY=/work/package-input/pathchord-${ROLE}d \
                PATHCHORDCTL_BINARY=/work/package-input/pathchordctl \
                /work/packaging/alpine/build.sh /out"
            '
      - name: Upload Alpine package
        uses: actions/upload-artifact@v7
        with:
          name: pathchord-native-alpine-${{ matrix.role }}
          path: |
            dist/*.apk
            dist/*.rsa.pub
          if-no-files-found: error
          retention-days: 14

  package-arch:
    name: Arch Linux packages
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [ingress, egress]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          name: pathchord-x86_64-unknown-linux-musl
          path: dist-input
      - name: Extract selected binaries
        env:
          ROLE: ${{ matrix.role }}
        run: |
          archive="dist-input/pathchord-$ROLE-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p package-input
          tar -xzf "$archive" -C package-input --strip-components=1
      - name: Build Arch package in a native container
        env:
          ROLE: ${{ matrix.role }}
        run: |
          version="$(./packaging/version.sh)"
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            -e ROLE="$ROLE" -e VERSION="$version" \
            archlinux:base-devel sh -ec '
              pacman -Syu --noconfirm archlinux-keyring
              useradd --create-home builder
              chmod 777 /out
              cp -a /src /work
              chown -R builder:builder /work
              su builder -s /bin/bash -c "PATHCHORD_ROLE=$ROLE PATHCHORD_VERSION=$VERSION \
                PATHCHORD_DAEMON_BINARY=/work/package-input/pathchord-${ROLE}d \
                PATHCHORDCTL_BINARY=/work/package-input/pathchordctl \
                /work/packaging/arch/build.sh /out"
            '
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: pathchord-native-arch-${{ matrix.role }}
          path: dist/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  package-freebsd:
    name: FreeBSD packages
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [ingress, egress]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download FreeBSD binaries
        uses: actions/download-artifact@v8
        with:
          name: pathchord-x86_64-unknown-freebsd
          path: dist-input
      - name: Extract selected binaries
        env:
          ROLE: ${{ matrix.role }}
        run: |
          archive="dist-input/pathchord-$ROLE-x86_64-unknown-freebsd.tar.gz"
          mkdir -p package-input
          tar -xzf "$archive" -C package-input --strip-components=1
      - name: Build FreeBSD package in a native VM
        env:
          ROLE: ${{ matrix.role }}
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y pkg
          run: |
            ROLE="${{ matrix.role }}"
            PATHCHORD_ROLE="$ROLE" \
              PATHCHORD_DAEMON_BINARY="$PWD/package-input/pathchord-${ROLE}d" \
              PATHCHORDCTL_BINARY="$PWD/package-input/pathchordctl" \
              sh packaging/freebsd/build.sh dist
      - name: Upload FreeBSD package
        uses: actions/upload-artifact@v7
        with:
          name: pathchord-native-freebsd-${{ matrix.role }}
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Windows installers
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [ingress, egress]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: pathchord-x86_64-pc-windows-msvc
          path: dist-input
      - name: Extract selected binaries
        shell: pwsh
        env:
          ROLE: ${{ matrix.role }}
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist-input/pathchord-$env:ROLE-x86_64-pc-windows-msvc.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath package-input -Force
          $nested = Get-ChildItem package-input -Directory | Select-Object -First 1
          Get-ChildItem $nested.FullName | Move-Item -Destination package-input -Force
          Remove-Item $nested.FullName -Recurse -Force
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - name: Build Windows installer
        shell: pwsh
        env:
          ROLE: ${{ matrix.role }}
        run: |
          $daemon = Join-Path $env:GITHUB_WORKSPACE "package-input/pathchord-${env:ROLE}d.exe"
          $ctl = Join-Path $env:GITHUB_WORKSPACE 'package-input/pathchordctl.exe'
          & packaging/windows/build.ps1 -Role $env:ROLE `
            -DaemonBinary $daemon -CtlBinary $ctl -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist')
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: pathchord-native-windows-${{ matrix.role }}
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    needs: [build, package-debian, package-alpine, package-arch, package-freebsd, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download role packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: pathchord-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum pathchord-* > SHA256SUMS

      - name: Attach packages to published release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload --clobber -- "$RELEASE_TAG" dist/*

      - name: Publish Nightly prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        run: |
          notes="Built from \`$GITHUB_SHA\` ([workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID))."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly --prerelease --latest=false --notes "$notes"
          else
            gh release create nightly dist/* --target "$GITHUB_SHA" \
              --title "PathChord Nightly" --prerelease --latest=false --notes "$notes"
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
            -f "sha=$GITHUB_SHA" -F force=true >/dev/null
