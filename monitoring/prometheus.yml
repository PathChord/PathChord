global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/pathchord.yml

scrape_configs:
  - job_name: pathchord-ingress
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/secrets/pathchord.token
    static_configs:
      - targets:
          - host.docker.internal:18090
