[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
snow = { version = "0.10.0", default-features = false, features = [
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
    "use-sha2",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# sccache and rustc incremental compilation are mutually exclusive. Keep local
# artifacts cacheable; CI performs clean builds and does not benefit from rustc
# incremental state either.
[profile.dev]
incremental = false

[profile.test]
incremental = false
