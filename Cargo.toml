[workspace]
members = ["crates/*"]
exclude = ["vendor/netlink-packet-utils"]
resolver = "3"

[patch.crates-io]
# REALITY needs ClientHello and key-exchange seams not exposed by upstream.
# See vendor/rustls/PATHCHORD-PATCH.md for the patch and verification scope.
rustls = { path = "vendor/rustls" }
# Hysteria2 Brutal needs per-packet pacing and loss notifications.
# See vendor/quinn-proto/PATHCHORD-PATCH.md for the patch and scope.
quinn-proto = { path = "vendor/quinn-proto" }
# netsock's Netlink dependencies require the 0.5 API. Keep its source intact
# while replacing the unmaintained paste macro dependency with pastey.
netlink-packet-utils = { path = "vendor/netlink-packet-utils" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
aho-corasick = "1.1.5"
atomic-write-file = "0.3.1"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
clatter = { version = "2.3.0", default-features = false, features = [
    "std",
    "use-25519",
    "use-chacha20poly1305",
] }
getrandom = "0.4.3"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
interprocess = { version = "2.4.8", default-features = false, features = ["tokio"] }
nix = { version = "0.31.3", default-features = false, features = ["net", "socket", "uio"] }
netsock = "0.8.0"
orion = { version = "0.18.1", default-features = false, features = ["zeroize"] }
proptest = "1.12.0"
prost = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
# Preserve the `serde_yaml` source namespace while using the maintained,
# pure-Rust compatibility facade; keep its parser and facade lockstep-pinned.
serde_yaml = { package = "noyalib-serde-yaml", version = "=0.0.60" }
shadowsocks = { version = "1.25.0", default-features = false, features = ["aead-cipher", "aead-cipher-2022", "aead-cipher-extra", "stream-cipher"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tun-rs = { version = "2.8.18", default-features = false, features = ["async"] }
url = "2.5.8"
windows-registry = "0.100.0"
widestring = "1.2.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# sccache and rustc incremental compilation are mutually exclusive. Keep local
# artifacts cacheable; CI performs clean builds and does not benefit from rustc
# incremental state either.
[profile.dev]
incremental = false

[profile.test]
incremental = false
