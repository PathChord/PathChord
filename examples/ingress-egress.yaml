apiVersion: pathchord.io/v1
kind: Egress
metadata:
  name: exit
spec:
  address: 127.0.0.1
  port: 9443
  publicKey: REPLACE_WITH_EGRESS_PUBLIC_KEY
  capabilities: {tcp: true, udp: true}
---
apiVersion: pathchord.io/v1
kind: TransitProxy
metadata:
  name: direct-path
spec:
  protocol: direct
---
apiVersion: pathchord.io/v1
kind: TrafficPolicy
metadata:
  name: default
spec:
  scheduler: effectiveCapacityWeighted
---
apiVersion: pathchord.io/v1
kind: EgressRule
metadata:
  name: egress-route
spec:
  order: 10
  catchAll: true
  egressRef: exit
---
apiVersion: pathchord.io/v1
kind: TransitRule
metadata:
  name: transit-route
spec:
  order: 20
  catchAll: true
  egressRef: exit
  trafficPolicyRef: default
---
apiVersion: pathchord.io/v1
kind: Listener
metadata:
  name: local-mixed
spec:
  type: mixed
  platform: any
  bind: 127.0.0.1:7890
  protocols: [tcp, udp]
  authentication: disabled
---
apiVersion: pathchord.io/v1
kind: DNSPolicy
metadata:
  name: dns
spec:
  defaultRoute: local
  local:
    servers: [9.9.9.9:53]
---
apiVersion: pathchord.io/v1
kind: FallbackPolicy
metadata:
  name: fallback
spec:
  action: reject
