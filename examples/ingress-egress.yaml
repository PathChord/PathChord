apiVersion: pathchord.io/v1
kind: Egress
metadata:
  name: exit
spec:
  endpoints:
    - address: 127.0.0.1
      port: 9443
    - address: "::1"
      port: 8443
    - address: egress.example.net
      port: 443
  publicKey: REPLACE_WITH_EGRESS_PUBLIC_KEY
  capabilities: {tcp: true, udp: true}
  statusRequirements:
    minUsablePaths: 1
  transit:
    require:
      capabilities: [tcp]
  trafficPolicyRef: default
---
apiVersion: pathchord.io/v1
kind: TransitProxy
metadata:
  name: direct-path
spec:
  protocol: direct
---
apiVersion: pathchord.io/v1
kind: TrafficPolicy
metadata:
  name: default
spec:
  scheduler: effectiveCapacityWeighted
---
apiVersion: pathchord.io/v1
kind: EgressRule
metadata:
  name: egress-route
spec:
  order: 10
  catchAll: true
  egressRef: exit
---
apiVersion: pathchord.io/v1
kind: Listener
metadata:
  name: local-mixed
spec:
  type: mixed
  platform: any
  bind: 127.0.0.1:7890
  protocols: [tcp, udp]
  authentication: disabled
---
apiVersion: pathchord.io/v1
kind: DNSPolicy
metadata:
  name: dns
spec:
  defaultRoute: local
  local:
    servers: [9.9.9.9:53]
---
apiVersion: pathchord.io/v1
kind: FallbackPolicy
metadata:
  name: fallback
spec:
  action: reject
